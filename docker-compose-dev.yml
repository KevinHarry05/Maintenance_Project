version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: sbms-postgres
    environment:
      POSTGRES_USER: sbms_user
      POSTGRES_PASSWORD: sbms_password
      POSTGRES_DB: sbms_db
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=en_US.UTF-8"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sbms_user -d sbms_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sbms-network
    restart: unless-stopped

  # Redis Cache & Message Broker
  redis:
    image: redis:7-alpine
    container_name: sbms-redis
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sbms-network
    restart: unless-stopped

  # Backend FastAPI Application
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sbms-backend
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://sbms_user:sbms_password@postgres:5432/sbms_db
      SECRET_KEY: ${SECRET_KEY:-change-this-secret-key-in-production}
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 30
      REFRESH_TOKEN_EXPIRE_DAYS: 7
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      CORS_ALLOWED_ORIGINS: http://localhost:3000,http://frontend:3000
      COMPLAINT_UPLOAD_DIR: /app/uploads/complaints
      GLOBAL_RATE_LIMIT_PER_MINUTE: 200
      LOGIN_RATE_LIMIT_PER_MINUTE: 5
      LOGIN_RATE_LIMIT_WINDOW_SECONDS: 60
      MAX_LOGIN_ATTEMPTS: 5
      TOKEN_BLACKLIST_CLEANUP_HOUR: 2
      TOKEN_BLACKLIST_CACHE_TTL_SECONDS: 300
      EMAIL_VERIFICATION_ENABLED: "true"
      VERIFICATION_TOKEN_EXPIRY_HOURS: 24
      RESEND_EMAIL_RATE_LIMIT: 3
      RESEND_EMAIL_RATE_LIMIT_WINDOW_MINUTES: 60
      MAX_UPLOAD_SIZE_MB: 10
      MAX_UPLOAD_SIZE_BYTES: 10485760
      PASSWORD_MIN_LENGTH: 12
      PASSWORD_COMPLEXITY_REQUIRED: "true"
      DOMAIN: localhost:8000
      SMTP_SERVER: smtp.gmail.com
      SMTP_PORT: 587
      SMTP_USERNAME: ${SMTP_USERNAME:-your-email@gmail.com}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-your-app-specific-password}
      SMTP_FROM_EMAIL: noreply@sbms.app
      SMTP_FROM_NAME: SBMS
      ENABLE_CELERY_HEALTH_CHECK: "false"
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - backend_uploads:/app/uploads
    command: |
      sh -c "
        echo 'Waiting for database...' &&
        sleep 5 &&
        alembic upgrade head &&
        uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
      "
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sbms-network
    restart: unless-stopped

  # Celery Worker for Background Tasks
  celery-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sbms-celery
    depends_on:
      - postgres
      - redis
      - backend
    environment:
      DATABASE_URL: postgresql+asyncpg://sbms_user:sbms_password@postgres:5432/sbms_db
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      SMTP_SERVER: ${SMTP_SERVER:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-your-email@gmail.com}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-your-app-specific-password}
      SMTP_FROM_EMAIL: noreply@sbms.app
      SMTP_FROM_NAME: SBMS
    volumes:
      - ./backend:/app
      - backend_uploads:/app/uploads
    command: celery -A app.celery_app worker --loglevel=info
    networks:
      - sbms-network
    restart: unless-stopped

  # Frontend Next.js Application
  frontend:
    image: node:18-alpine
    container_name: sbms-frontend
    depends_on:
      - backend
    working_dir: /app
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    command: sh -c "npm install && npm run dev"
    networks:
      - sbms-network
    restart: unless-stopped

networks:
  sbms-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  backend_uploads:
    driver: local
